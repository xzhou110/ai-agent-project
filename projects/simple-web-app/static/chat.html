<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat — Research assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222d;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --ok: #5bd48a;
      --warn: #e8b84a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
    }
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .row {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: #061018;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .busy .spinner { display: inline-block; vertical-align: middle; margin-left: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .panel {
      margin-top: 1.75rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }
    .panel h2 {
      margin: 0;
      padding: 0.65rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: rgba(0,0,0,0.25);
      border-bottom: 1px solid var(--border);
    }
    #log {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      line-height: 1.45;
      max-height: 280px;
      overflow-y: auto;
      padding: 0.75rem 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #c5d0e0;
    }
    #log .ts { color: var(--muted); }
    #log .tool { color: var(--warn); }
    #log .ok { color: var(--ok); }
    #log .err { color: #f07178; }
    .answer-wrap {
      margin-top: 1.75rem;
    }
    .answer-wrap h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    #answer {
      padding: 1rem 1.15rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      white-space: pre-wrap;
      word-break: break-word;
    }
    #answer:empty::before {
      content: "Your answer will appear here.";
      color: var(--muted);
    }
    .hint {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Research chat</h1>
      <p class="sub">Ask a question. The agent may search the web and read pages. Live status lines show what it is doing.</p>
    </header>

    <label for="msg">Your message</label>
    <textarea id="msg" placeholder="e.g. What’s the latest on…"></textarea>
    <div class="row">
      <button type="button" id="send">Send</button>
      <span id="busyRow" class="spinner" aria-hidden="true"></span>
    </div>

    <div class="panel">
      <h2>Activity log</h2>
      <div id="log"></div>
    </div>

    <div class="answer-wrap">
      <h2>Answer</h2>
      <div id="answer"></div>
    </div>

    <p class="hint">Open this page at <strong>/chat-ui</strong> on your server (e.g. http://127.0.0.1:8000/chat-ui).</p>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const send = document.getElementById("send");
    const logEl = document.getElementById("log");
    const answerEl = document.getElementById("answer");
    const busyRow = document.getElementById("busyRow");

    function ts() {
      return new Date().toLocaleTimeString(undefined, { hour12: false });
    }

    function appendLog(line, cls = "") {
      const span = document.createElement("div");
      span.innerHTML = `<span class="ts">[${ts()}]</span> <span class="${cls}">${escapeHtml(line)}</span>`;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function setBusy(b) {
      send.disabled = b;
      busyRow.style.display = b ? "inline-block" : "none";
      document.body.classList.toggle("busy", b);
    }

    send.addEventListener("click", async () => {
      const text = msg.value.trim();
      if (!text) {
        appendLog("Please enter a message.", "err");
        return;
      }
      logEl.innerHTML = "";
      answerEl.textContent = "";
      setBusy(true);
      appendLog("Sending request…", "");

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_message: text }),
        });

        if (!res.ok) {
          const t = await res.text();
          appendLog(`HTTP ${res.status}: ${t}`, "err");
          return;
        }

        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";
          for (const line of lines) {
            if (!line.trim()) continue;
            let ev;
            try {
              ev = JSON.parse(line);
            } catch {
              appendLog("Bad JSON line: " + line.slice(0, 120), "err");
              continue;
            }
            if (ev.type === "status") {
              appendLog(ev.message || "", "");
            } else if (ev.type === "tool_call") {
              const a = ev.arguments_preview || ev.arguments || "";
              appendLog(`Tool: ${ev.label || ev.name} — ${a}`, "tool");
            } else if (ev.type === "tool_result") {
              appendLog(`Tool result (${ev.label || "tool"}): ${ev.preview || ""}`, "");
            } else if (ev.type === "synthesis") {
              appendLog(ev.message || "Synthesis…", "ok");
            } else if (ev.type === "done") {
              answerEl.textContent = ev.content || "";
              appendLog("Done.", "ok");
            } else if (ev.type === "error") {
              appendLog("Error: " + (ev.detail || "unknown"), "err");
            }
          }
        }
      } catch (e) {
        appendLog(String(e), "err");
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
